plugins {
    id 'com.android.application'
}

android {
    namespace 'uz.pultanuvchi'
    compileSdk 35

    defaultConfig {
        applicationId 'uz.pultanuvchi'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '1.2'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // CameraX eski kotlin-stdlib-jdk7/jdk8 ni ham olib keladi va u yangi kotlin-stdlib bilan to'qnashadi
    // ("Duplicate class kotlin..." xatosi). BOM hamma Kotlin kutubxonalarini bir versiyaga keltiradi.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.annotation:annotation-experimental:1.4.1'

    def cameraxVersion = '1.3.4'
    implementation "androidx.camera:camera-core:${cameraxVersion}"
    implementation "androidx.camera:camera-camera2:${cameraxVersion}"
    implementation "androidx.camera:camera-lifecycle:${cameraxVersion}"
    implementation "androidx.camera:camera-view:${cameraxVersion}"

    // Qurilmaning oʻzida (internetsiz) ishlaydigan matn aniqlash (lotin yozuvi)
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
